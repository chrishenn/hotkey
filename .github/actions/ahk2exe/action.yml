    - name: Create cache seed file
      shell: bash
      run: echo ${{ env.packages_to_install }} >> ${{ env.cache_hash_seed_file_path }}

    - name: Restore cache if available
      id: restore_cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: '~/scoop'
        key: cache_version_${{ env.cache_version }}-${{ hashFiles(env.cache_hash_seed_file_path) }}

    - name: Install scoop
      uses: MinoruSekine/setup-scoop@f1cc59be496ed3a1801a5f64efe5c60ba3d6bb75 # v5.0.1
      if: steps.restore_cache.outputs.cache-hit != 'true'
      with:
        install_scoop: true
        buckets: extras versions
        apps: ${{ env.packages_to_install }}
        scoop_update: true
        update_path: true

    - name: Put scoop on path
      uses: MinoruSekine/setup-scoop@f1cc59be496ed3a1801a5f64efe5c60ba3d6bb75 # v5.0.1
      if: steps.restore_cache.outputs.cache-hit == 'true'
      with:
        install_scoop: false
        scoop_update: false
        update_path: true

    - name: Install ahk2exe
      id: install
      shell: pwsh
      run: |
        $ahk = (scoop which autohotkey)
        $directory = (Resolve-Path (Split-Path -Path $ahk)).Path
        $version = (scoop info autohotkey).Version

        $ahdir = "$(scoop prefix autohotkey)"
        $ahk2exe = "$ahdir\Compiler\Ahk2Exe.exe"
        $base = "$ahdir\v2\autohotkey64.exe"
        $installer = "$ahdir\UX\install-ahk2exe.ahk"

        start-process $base -wait -a "/script $installer /silent /base $base"
        if (! (test-path $ahk2exe)) {
          write-host -f r "ERROR: ahk2exe.exe compiler was not found at: $ahk2exe"
          exit 1
        }

        echo "directory=$directory" >> $GITHUB_OUTPUT
        echo "version=$version" >> $GITHUB_OUTPUT

    - name: Compile Script
      id: compile
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'

        $ahdir = "$(scoop prefix autohotkey)"
        $base = "$ahdir\v2\autohotkey64.exe"
        $ahk2exe = "$ahdir\Compiler\Ahk2Exe.exe"

        $args = @()
        $with = @{
          'in' = "$env:INPUTS_IN"; 'out' = "$env:INPUTS_OUT"; 'icon' = "$env:INPUTS_ICON";
          'cp' = "$env:INPUTS_CP"; 'base' = "$base"; 'compress' = "$env:INPUTS_COMPRESS";
          'resourceid' = "$env:INPUTS_RESOURCEID";
        }

        ForEach ($key in @($with.Keys)) {
          If (![string]::IsNullOrEmpty($with["$key"])) {
            $is_path = $true

            Switch ($key) {
              { @('in', 'icon', 'base') -contains $_} {
                $with["$key"] = Resolve-Path -Path $with["$key"]
              }
              { @('out') -contains $_ } {
                $with["$key"] = Join-Path $pwd $with["$key"]
                New-Item $(Split-Path -Path $with["$key"]) -Force -ItemType Directory > $null
              }
              default { $is_path = $false }
            }

            If ($is_path) {
              $args += "/$key '$($with["$key"])'"
            } Else {
              $args += "/$key $($with["$key"])"
            }
          }
        }

        Invoke-Expression "$ahk2exe $($args -join ' ')" | Out-String -OutVariable output

        $binary = $output.Split([Environment]::NewLine).Where({ $_.contains('exe') })
        echo "binary=$binary" >> $GITHUB_OUTPUT
        echo "::notice ::Successfully compiled as: ${binary}."
      env:
        INPUTS_IN: ${{ inputs.in }}
        INPUTS_OUT: ${{ inputs.out }}
        INPUTS_ICON: ${{ inputs.icon }}
        INPUTS_CP: ${{ inputs.cp }}
        INPUTS_COMPRESS: ${{ inputs.compress }}
        INPUTS_RESOURCEID: ${{ inputs.resourceid }}
