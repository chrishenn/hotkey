name: Compile AutoHotkey Script
author: CEnnis91
description: Compiles AutoHotkey scripts into EXEs using Ahk2Exe

branding:
  icon: 'package'
  color: 'blue'

inputs:
  in:
    description: The path and name of the script to compile.
    required: true
  out:
    description: The path\name of the output .exe to be created. Default is the directory\base_name of the input file plus extension of .exe.
    required: false
    default: ''
  icon:
    description: The icon file to be used.
    required: false
    default: ''
  cp:
    description: Overrides the default codepage used to read script files.
    required: false
    default: ''
  base:
    description: The base file to be used (a .bin or .exe file).
    required: false
    default: 'Unicode 64-bit.bin'
  compress:
    description: Compress the exe? 0 = no, 1 = use MPRESS if present, 2 = use UPX if present.
    required: false
    default: ''
  resourceid:
    description: Assigns a non-standard resource ID to be used for the main script for compilations which use an .exe base file.
    required: false
    default: ''

outputs:
  binary:
    description: The compiled AutoHotkey binary
    value: ${{ steps.compile.outputs.binary }}
  directory:
    description: The base directory of the installed AutoHotkey
    value: ${{ steps.install.outputs.directory }}
  version:
    description: The version of the installed AutoHotkey
    value: ${{ steps.install.outputs.version }}

runs:
  using: composite
  steps:

    - name: compile ahk script
      id: compile
      shell: pwsh
      env:
        INPUTS_IN: ${{ inputs.in }}
        INPUTS_OUT: ${{ inputs.out }}
        INPUTS_ICON: ${{ inputs.icon }}
        INPUTS_CP: ${{ inputs.cp }}
        INPUTS_COMPRESS: ${{ inputs.compress }}
        INPUTS_RESOURCEID: ${{ inputs.resourceid }}
      run: |
        $ErrorActionPreference = 'Stop'
        $ahdir = "$( scoop prefix autohotkey )"
        $ahk2exe = "$ahdir\Compiler\Ahk2Exe.exe"
        $base = Resolve-Path "$ahdir\v2\autohotkey64.exe"

        $arg = @("/base '$base'")
        if ($env:INPUTS_IN) {
            $in = Resolve-Path $env:INPUTS_IN
            $arg += "/in '$in'"
        }
        if ($env:INPUTS_ICON) {
            $icon = Resolve-Path $env:INPUTS_ICON
            $arg += "/icon '$icon'"
        }
        if ($env:INPUTS_OUT) {
            $out = Join-Path $pwd $env:INPUTS_OUT
            New-Item $( Split-Path $out ) -Force -ItemType Directory > $null
            $arg += "/out '$out'"
        }
        if ($env:INPUTS_CP) {
            $arg += "/cp $env:INPUTS_CP"
        }
        if ($env:INPUTS_COMPRESS) {
            $arg += "/compress $env:INPUTS_COMPRESS"
        }
        if ($env:INPUTS_RESOURCEID) {
            $arg += "/resourceid $env:INPUTS_RESOURCEID"
        }

        $arg = $arg -join ' '
        Invoke-Expression "$ahk2exe $arg" | Out-String -OutVariable output
        $binary = $output.Split([Environment]::NewLine).Where({ $_.contains('exe') })
        echo "binary=$binary" >> $GITHUB_OUTPUT
