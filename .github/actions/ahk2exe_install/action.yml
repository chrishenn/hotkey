name: Install ahk2exe
author: chrishenn
description: Install ahk2exe using scoop

inputs:
  cache_bust:
    description: Whether to manually invalidate the gha scoop cache
    required: false
    default: false

runs:
  using: composite
  steps:
    - name: get cache key
      id: cache_key
      shell: bash
      # we use the month to auto invalidate cache every month, with cache_bust to manually override
      run: |
        bust=$(echo $(date +%s) | sha256sum | cut -c1-64)
        bust_key="${{ github.event.inputs.cache_bust == 'true' && '$bust' || '' }}"
        month="$(/bin/date -u '+%m')"
        echo "cache_key=${bust_key}_${month}" >> $GITHUB_OUTPUT

    - name: Restore cache if available and not invalidated by timeout
      id: restore_cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: '~/scoop'
        key: cache_${{ steps.cache_key.outputs.cache_key }}

    - name: Install scoop
      uses: MinoruSekine/setup-scoop@f1cc59be496ed3a1801a5f64efe5c60ba3d6bb75 # v5.0.1
      if: steps.restore_cache.outputs.cache-hit != 'true'
      with:
        install_scoop: true
        buckets: extras # not idempotent. get wrecked
        apps: autohotkey
        scoop_update: true
        update_path: true

    - name: Put scoop on path
      uses: MinoruSekine/setup-scoop@f1cc59be496ed3a1801a5f64efe5c60ba3d6bb75 # v5.0.1
      if: steps.restore_cache.outputs.cache-hit == 'true'
      with:
        install_scoop: false
        scoop_update: false
        update_path: true

    - name: Install ahk2exe
      id: install
      shell: pwsh
      run: |
        $ahk = (scoop which autohotkey)
        $directory = (Resolve-Path (Split-Path -Path $ahk)).Path
        $version = (scoop info autohotkey).Version

        $ahdir = "$(scoop prefix autohotkey)"
        $ahk2exe = "$ahdir\Compiler\Ahk2Exe.exe"
        $base = "$ahdir\v2\autohotkey64.exe"
        $installer = "$ahdir\UX\install-ahk2exe.ahk"

        start-process $base -wait -a "/script $installer /silent /base $base"
        if (! (test-path $ahk2exe)) {
          write-host -f r "ERROR: ahk2exe.exe compiler was not found at: $ahk2exe"
          exit 1
        }

        echo "directory=$directory" >> $GITHUB_OUTPUT
        echo "version=$version" >> $GITHUB_OUTPUT
