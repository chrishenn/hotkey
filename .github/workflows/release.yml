name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: install ahk2exe with scoop
        uses: '$/.github/actions/ahk2exe_install'
      - name: Compile with Ahk2Exe
        uses: '$/.github/actions/ahk2exe'
        with:
          in: AHhotkey.ahk
      - name: Compile with Ahk2Exe
        uses: '$/.github/actions/ahk2exe'
        with:
          in: AHmacro.ahk
      - name: Archive
        uses: thedoctor0/zip-release@b57d897cb5d60cb78b51a507f63fa184cfe35554 # 0.7.6
        with:
          type: zip
          filename: hotkey.zip
          exclusions: '*_ahktmp* *.ahk *.git* *.github* .gitignore .artifacts readme.md mise.toml justfile hk.pkl'
      - name: Upload Artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hotkey.zip
          path: hotkey.zip
          overwrite: true
          if-no-files-found: error

  release:
    name: release
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      # automated release
      contents: write
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: hotkey.zip
          path: pkg
      - name: GitHub Release
        shell: bash
        run: |
          gh release delete "${GITHUB_REF_NAME}" --repo "${GITHUB_REPO}" || true
          gh release create "${GITHUB_REF_NAME}" pkg/* --repo "${GITHUB_REPO}" --title "${GITHUB_REF_NAME}" --notes "Automated release of ${GITHUB_REF_NAME}"
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
          GITHUB_REPO: ${{github.repository}}
