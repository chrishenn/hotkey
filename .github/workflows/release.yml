name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - name: Compile with Ahk2Exe
        uses: ./.github/actions/ahk2exe
        with:
          in: AHhotkey.ahk
      - name: Compile with Ahk2Exe
        uses: ./.github/actions/ahk2exe
        with:
          in: AHmacro.ahk
      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: hotkey.zip
          path: '{*.exe,version,install.ps1}'
          overwrite: true
          archive: true
#      - name: Archive
#        uses: thedoctor0/zip-release@0.7.6
#        with:
#          type: 'zip'
#          filename: hotkey.zip
#          exclusions: '*_ahktmp* *.ahk *.git* *.github* .gitignore .artifacts readme.md mise.toml justfile'

  release:
    name: release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v8
        with:
          name: hotkey.zip
          path: pkg
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: pkg/hotkey.zip
          tag_name: ${{ github.ref_name }}
          body: "Automated release of ${{ github.ref_name }}."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}